name: Gold & Dollar Price Reporter

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up System Dependencies for Arabic/Persian
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 pillow arabic-reshaper jdatetime

      - name: Run Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python gold_report.py

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-price-image
          path: Gold_Dollar_Report.png

