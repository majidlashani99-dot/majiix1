name: Scoreyab Daily Matches

on:
  schedule:
    # ساعت 04:30 به وقت UTC برابر با 08:00 صبح به وقت ایران (IRST)
    - cron: '30 4 * * *'
  workflow_dispatch: # دکمه اجرای دستی برای تست

jobs:
  run-scoreyab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and Send Scoreyab Matches
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scoreyab_matches.py
