name: Daily Live Matches Conductor

on:
  schedule:
    # ساعت 08:53 صبح ایران = ساعت 05:23 صبح به وقت جهانی (UTC)
    - cron: '23 05 * * *'
  workflow_dispatch:

jobs:
  conductor-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and Send Conductor Report
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python daily_conductor.py
