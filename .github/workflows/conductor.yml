name: Auto Conductor Daily Forwarder

on:
  schedule:
    # ساعت 11:46 صبح ایران = 08:16 صبح UTC
    - cron: '16 08 * * *'
  workflow_dispatch:

jobs:
  forward-conductor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Conductor Forwarder
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python forwarder.py
