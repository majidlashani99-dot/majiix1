name: Daily Football Matches Report

on:
  schedule:
    - cron: '12 5 * * *'
  workflow_dispatch:

jobs:
  broadcast-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libs
        run: pip install requests beautifulsoup4

      - name: Run Football Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python football_matches.py