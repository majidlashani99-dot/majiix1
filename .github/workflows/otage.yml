name: Iran Outage Reporter

on:
  schedule:
    - cron: "30 4 * * *" # هر روز ساعت ۸:۰۰ صبح به وقت ایران
  workflow_dispatch: # امکان اجرای دستی با یک کلیک

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 reportlab arabic-reshaper python-bidi

      - name: Run Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main.py

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outage-report-pdf
          path: Doroud_Outage_Report.pdf
