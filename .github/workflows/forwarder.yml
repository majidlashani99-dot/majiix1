name: Auto Forward Conductor Posts

on:
  workflow_dispatch: # امکان اجرای دستی در هر لحظه
  repository_dispatch:
    types: [trigger-forwarder]
  schedule:
    # 09:17 AM Iran Time (UTC+3:30) => 05:47 UTC
    - cron: '47 5 * * *'

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Forwarder Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SOURCE_CHANNEL: "SPORTinoTV"
          FILTER_TEXT: "کنداکتور"
        run: |
          python forwarder.py
